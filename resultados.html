<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados · EI Tracker (negocio y producto)</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  --paper:#EEEAE0; --surface:#F8F6F0; --ink:#202A26; --ink-soft:#5B6560;
  --line:#D6D0C0; --accent:#2F5D57; --accent-soft:#E4EBE6;
  --alta-bg:#F4E3E0; --alta-fg:#8C3B32; --alta-dot:#B5453D;
  --media-bg:#F5EAD8; --media-fg:#8A5A22; --media-dot:#C98A3E;
  --baja-bg:#E6ECE3; --baja-fg:#3E5A3E; --baja-dot:#6E8F63;
  margin:0; padding:22px 18px 90px; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13.5px; line-height:1.55;
}
.wrap { max-width:900px; margin:0 auto; }
h1,h2,h3,h4 { font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace; margin:0; }
.mast { border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:14px;
  display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; }
.mast .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
.mast h1 { font-size:22px; font-weight:600; letter-spacing:-.01em; }
.mast p.sub { font-size:12.5px; color:var(--ink-soft); max-width:360px; text-align:right; margin:0; }
.note { display:flex; gap:9px; align-items:flex-start; font-size:12px; color:var(--ink-soft);
  background:var(--accent-soft); border:1px solid var(--line); padding:9px 12px; border-radius:3px;
  margin-bottom:14px; flex-wrap:wrap; }
.note.warn { background:var(--media-bg); color:var(--media-fg); border-color:var(--media-dot); }
.note.err { background:var(--alta-bg); color:var(--alta-fg); border-color:var(--alta-dot); }
.note .grow { flex:1; min-width:220px; }
.tabs { display:flex; gap:3px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
.tab { font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase;
  letter-spacing:.06em; background:none; border:1px solid transparent; border-bottom:none;
  padding:8px 12px; cursor:pointer; color:var(--ink-soft); border-radius:3px 3px 0 0; }
.tab:hover { color:var(--ink); }
.tab.active { background:var(--surface); border-color:var(--line); color:var(--ink); font-weight:600;
  margin-bottom:-1px; padding-bottom:9px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 17px; margin-bottom:13px; }
.card-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  flex-wrap:wrap; margin-bottom:11px; padding-bottom:8px; border-bottom:1px solid var(--line); }
.card-head h3 { font-size:14.5px; font-weight:600; }
.card-head .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
  text-transform:uppercase; letter-spacing:.07em; }
.sect { font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--accent); margin:16px 0 9px; padding-bottom:4px;
  border-bottom:1px solid var(--line); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px 14px; }
@media (max-width:720px){ .grid2,.grid3 { grid-template-columns:1fr; } }
label.f { display:flex; flex-direction:column; gap:4px; margin-bottom:9px; }
label.f > span.l { font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.07em; color:var(--ink-soft); }
label.f > span.h { font-size:11px; color:var(--ink-soft); font-style:italic; }
input,select,textarea { font-family:inherit; font-size:13px; color:var(--ink); background:#fff;
  border:1px solid var(--line); border-radius:3px; padding:7px 9px; width:100%; }
input:focus,select:focus,textarea:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
textarea { resize:vertical; min-height:54px; }
button { font-family:'IBM Plex Mono',monospace; cursor:pointer; }
.btn { font-size:12px; padding:7px 13px; border-radius:3px; border:1px solid var(--line);
  background:#fff; color:var(--ink); display:inline-flex; align-items:center; gap:6px; }
.btn:hover { border-color:var(--accent); }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.primary:hover { background:#254a45; }
.btn.danger { color:var(--alta-fg); border-color:var(--alta-bg); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn.sm { font-size:11px; padding:5px 9px; }
.btn.big { font-size:13px; padding:10px 18px; }
.row-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:13px; flex-wrap:wrap; align-items:center; }
.pill { font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:2px 7px; border-radius:9px;
  border:1px solid var(--line); background:#fff; color:var(--ink-soft); white-space:nowrap; }
.pill.P0 { background:var(--alta-bg); color:var(--alta-fg); border-color:var(--alta-dot); }
.pill.P1 { background:var(--media-bg); color:var(--media-fg); border-color:var(--media-dot); }
.pill.P2 { background:var(--accent-soft); color:var(--accent); }
.pill.oculta { background:transparent; color:var(--muted); border-style:dashed; }
.fila-oculta { opacity:.5; }
.fila-oculta b { text-decoration:line-through; }
.blk.oculto { opacity:.62; border-style:dashed; }
.badge { display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace;
  font-size:10.5px; padding:2px 8px; border-radius:9px; }
.badge .dot { width:6px; height:6px; border-radius:50%; }
.badge.Alta { background:var(--alta-bg); color:var(--alta-fg); } .badge.Alta .dot { background:var(--alta-dot); }
.badge.Media { background:var(--media-bg); color:var(--media-fg); } .badge.Media .dot { background:var(--media-dot); }
.badge.Baja { background:var(--baja-bg); color:var(--baja-fg); } .badge.Baja .dot { background:var(--baja-dot); }
.res { font-family:'IBM Plex Mono',monospace; font-size:11px; }
.res.ok { color:var(--baja-fg); } .res.help { color:var(--media-fg); } .res.no { color:var(--alta-fg); }

/* ---- pasos guiados ---- */
.paso { border:1px solid var(--line); border-radius:4px; background:var(--surface); margin-bottom:9px; overflow:hidden; }
.paso.open { border-color:var(--accent); box-shadow:0 1px 0 var(--accent-soft); }
.paso-head { width:100%; display:flex; align-items:center; gap:11px; padding:12px 14px;
  background:none; border:none; text-align:left; font-family:inherit; font-size:13.5px; flex-wrap:wrap; }
.paso-head:hover { background:#fff; }
.paso.open .paso-head { background:#fff; border-bottom:1px solid var(--line); }
.paso-head .num { width:23px; height:23px; border-radius:50%; background:var(--accent-soft);
  color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:11.5px; display:flex;
  align-items:center; justify-content:center; flex:none; }
.paso.done .paso-head .num { background:var(--baja-dot); color:#fff; }
.paso-head .tit { font-family:'IBM Plex Mono',monospace; font-weight:600; }
.paso-head .min { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
.paso-head .sp { flex:1; }
.paso-head .crono { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);
  background:var(--paper); padding:2px 8px; border-radius:9px; }
.paso-head .crono.over { background:var(--media-bg); color:var(--media-fg); }
.paso-head .crono.run { background:var(--accent); color:#fff; }
.paso-body { padding:14px; }

.leer { background:#fff; border:1px solid var(--accent); border-left-width:4px; border-radius:3px;
  padding:12px 14px; margin-bottom:12px; }
.leer .lbl { font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--accent); display:block; margin-bottom:5px; }
.leer p { margin:0 0 8px; font-size:14.5px; line-height:1.6; }
.leer p:last-child { margin:0; }
.leer .q { font-style:italic; }
.obs-list { background:var(--accent-soft); border-radius:3px; padding:11px 13px; margin-bottom:12px; }
.obs-list .lbl { font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--accent); display:block; margin-bottom:7px; }
.chk { display:flex; gap:8px; align-items:flex-start; margin-bottom:5px; font-size:12.5px; cursor:pointer; }
.chk input { width:15px; height:15px; margin:2px 0 0; flex:none; accent-color:var(--accent); }
.chk.on { color:var(--accent); font-weight:500; }
.opts { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px; }
.opt { font-size:12.5px; padding:9px 14px; border-radius:3px; border:1px solid var(--line);
  background:#fff; color:var(--ink-soft); }
.opt:hover { border-color:var(--accent); }
.opt.on { border-color:var(--accent); background:var(--accent); color:#fff; font-weight:600; }
.opt.on.ok { background:var(--baja-fg); border-color:var(--baja-fg); }
.opt.on.help { background:var(--media-fg); border-color:var(--media-fg); }
.opt.on.no { background:var(--alta-fg); border-color:var(--alta-fg); }
.opt.num { min-width:44px; justify-content:center; text-align:center; }
.masdet { border-top:1px dashed var(--line); margin-top:10px; padding-top:10px; }
.toggle { background:none; border:none; color:var(--accent); font-size:11.5px; padding:0;
  text-decoration:underline; font-family:'IBM Plex Mono',monospace; }
.paso-next { display:flex; justify-content:space-between; align-items:center; gap:9px;
  margin-top:13px; padding-top:11px; border-top:1px solid var(--line); flex-wrap:wrap; }

/* ---- chuleta flotante ---- */
.chuleta-btn { position:fixed; right:16px; bottom:16px; z-index:40; background:var(--accent);
  color:#fff; border:none; border-radius:22px; padding:11px 17px; font-size:12.5px;
  box-shadow:0 4px 16px rgba(0,0,0,.22); }
.chuleta { position:fixed; right:16px; bottom:62px; z-index:41; width:310px; max-width:calc(100vw - 32px);
  max-height:65vh; overflow-y:auto; background:#fff; border:1px solid var(--accent); border-radius:5px;
  padding:14px 15px; box-shadow:0 8px 30px rgba(0,0,0,.24); }
.chuleta h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin:0 0 6px; }
.chuleta h4:not(:first-child) { margin-top:13px; }
.chuleta ul { margin:0; padding-left:16px; font-size:12.5px; } .chuleta li { margin-bottom:3px; }
.chuleta .no li { color:var(--alta-fg); }

table { width:100%; border-collapse:collapse; font-size:12.5px; }
th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.07em; color:var(--ink-soft); background:var(--accent-soft); }
td.w { min-width:170px; }
.tbl-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:3px; background:var(--surface); }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(125px,1fr)); gap:9px; margin-bottom:14px; }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:11px 13px; }
.stat .n { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; display:block; }
.stat .l { font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;
  font-family:'IBM Plex Mono',monospace; }
.bar-row { display:grid; grid-template-columns:1fr 140px 100px; gap:10px; align-items:center; margin-bottom:6px; font-size:12.5px; }
.bar-track { height:9px; background:#E3DFD3; border-radius:5px; overflow:hidden; }
.bar { height:100%; border-radius:5px; }
.bar-num { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
@media (max-width:700px){ .bar-row { grid-template-columns:1fr; gap:3px; } }
.sess { border:1px solid var(--line); border-radius:3px; background:var(--surface); margin-bottom:8px; }
.sess-head { width:100%; display:flex; align-items:center; gap:10px; padding:10px 13px; background:none;
  border:none; text-align:left; font-family:inherit; font-size:13px; flex-wrap:wrap; }
.sess-head:hover { background:#fff; }
.sess-head .id { font-family:'IBM Plex Mono',monospace; font-weight:600; }
.sess-head .meta { font-size:11.5px; color:var(--ink-soft); }
.sess-head .sp { flex:1; }
.sess-body { padding:0 14px 14px; border-top:1px solid var(--line); }
.obs { border-left:2px solid var(--line); padding:8px 0 8px 12px; margin-top:10px; }
.obs p { margin:3px 0; font-size:12.5px; }
.obs .quote { font-style:italic; color:var(--accent); border-left:2px solid var(--accent-soft); padding-left:8px; }
.empty { text-align:center; padding:36px 20px; color:var(--ink-soft); background:var(--surface);
  border:1px dashed var(--line); border-radius:4px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:11px; }
.filters input,.filters select { width:auto; min-width:130px; }
.filters .search { flex:1; min-width:200px; }
.hide { display:none !important; }
.spin { display:inline-block; width:12px; height:12px; border:2px solid var(--line);
  border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; }
@keyframes sp { to { transform:rotate(360deg); } }
.overlay { position:fixed; inset:0; background:rgba(32,42,38,.45); display:flex; align-items:center;
  justify-content:center; z-index:50; padding:20px; }
.modal { background:#fff; border-radius:5px; padding:20px 22px; max-width:360px; box-shadow:0 10px 40px rgba(0,0,0,.2); }
.modal p { margin:0 0 16px; font-size:13px; }
.toast { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:var(--ink);
  color:#fff; padding:10px 16px; border-radius:4px; font-size:12.5px; z-index:60;
  font-family:'IBM Plex Mono',monospace; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:90vw; }
.toast.err { background:var(--alta-dot); }
.mini { font-size:11.5px; color:var(--ink-soft); }
ul.clean { margin:5px 0 0; padding-left:17px; font-size:12.5px; }
ul.clean li { margin-bottom:3px; }
.hp { background:#fff; border:1px solid var(--line); border-radius:3px; padding:9px 11px; margin-bottom:7px; }
.hp .n { font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; display:block; margin-bottom:3px; }
.hp .p { font-size:12px; color:var(--ink-soft); }
.item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
.item-head .ix { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent);
  text-transform:uppercase; letter-spacing:.07em; }
.blk { border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:3px;
  background:#fff; padding:13px 15px; margin-bottom:11px; }
.blk-head { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:9px; }
.blk-head .name { font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; }
.blk-head .dur { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
.script { background:var(--accent-soft); border-radius:3px; padding:10px 12px; margin-bottom:11px; font-size:12.5px; }
.script p { margin:0 0 6px; } .script p:last-child { margin:0; }
.script .q { font-style:italic; }
.script ul { margin:4px 0 0; padding-left:17px; }
</style>
<style>
.mast .sub { max-width:640px; }
.aviso { background:var(--accent-soft); border:1px solid var(--line); border-radius:12px;
  padding:11px 14px; margin-bottom:16px; font-size:13px; color:var(--ink-soft); }
.aviso b { color:var(--ink); }
.mini-tabla td, .mini-tabla th { text-align:left; }
table.matriz td.mtz { vertical-align:middle; text-align:center; min-width:110px; }
table.matriz td.mtz.win { background:var(--baja-bg); }
.mtz-count { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div>
      <p class="eyebrow">Diseños EI Tracker · ServiceNow</p>
      <h1>Resultados de usabilidad</h1>
    </div>
    <p class="sub">Vista de solo lectura para negocio y producto. Resumen agregado de las pruebas; el detalle completo (hallazgos, citas e insights) vive en Airtable.</p>
  </div>

  <div id="fecha" class="aviso"></div>

  <div class="tabs">
    <button class="tab active" data-tab="guion">Guion completo</button>
    <button class="tab" data-tab="sintesis">Síntesis</button>
    <button class="tab" data-tab="matriz">Matriz de evidencia</button>
  </div>

  <div id="v-guion" class="view"></div>
  <div id="v-sintesis" class="view hide"></div>
  <div id="v-matriz" class="view hide"></div>
</div>
<script src="guion.js"></script>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ui = { guionRol: ROLES[0] };
let DATOS = null;

const minutosDe = (b) => Number(String((b && b.duracion) || "").match(/\d+/) || [0]) || 0;
function estructuraDe(rol) {
  const g = GUION[rol];
  const filas = [
    ["Apertura", 3, "Contexto, consentimiento y pregunta inicial."],
    ["Orientación", minutosDe(g.orientacion), "Comprender la página de inicio y las prioridades."],
    ["Navegación común", minutosDe(g.navegacion), "Filtrar, localizar y abrir una EI."],
    ...g.criticas.map((c) => ["Tarea crítica · " + c.nombre, minutosDe(c), c.tarea]),
    ["Cierre", 5, "Evaluación y preguntas finales."]
  ];
  return { filas, total: filas.reduce((a, f) => a + f[1], 0) };
}

/* ---- Síntesis agregada (desde el snapshot, sin texto de participantes) ---- */
function renderSintesis() {
  const el = document.getElementById("v-sintesis");
  if (!DATOS) { el.innerHTML = vacio(); return; }
  const d = DATOS, t = d.totales;
  const fr = (d.friccion || []).slice().sort((a, b) => (b.no + b.alta) - (a.no + a.alta) || b.total - a.total);
  const maxT = Math.max(1, ...fr.map((v) => v.total));
  const totHal = ROLES.reduce((s, r) => s + (d.hallazgos[r] ? d.hallazgos[r].Alta + d.hallazgos[r].Media + d.hallazgos[r].Baja : 0), 0);
  const area = d.porArea || null;
  const areaKeys = area ? [...AREAS, "Sin clasificar"] : [];
  const maxA = area ? Math.max(1, ...areaKeys.map((k) => area[k] || 0)) : 1;
  const efCols = [...ESFUERZOS, "Sin estimar"];
  el.innerHTML = `
  <div class="stats">
    <div class="stat"><span class="n">${t.sesiones}</span><span class="l">Sesiones</span></div>
    <div class="stat"><span class="n">${t.tasaP0}%</span><span class="l">Éxito P0 sin ayuda</span></div>
    <div class="stat"><span class="n">${t.noCompletadas}</span><span class="l">No completadas</span></div>
    <div class="stat" style="border-color:var(--alta-dot)"><span class="n" style="color:var(--alta-fg)">${t.hallazgosAltos}</span><span class="l">Hallazgos altos</span></div>
    <div class="stat"><span class="n">${t.facilidadTareaMedia ?? "—"}</span><span class="l">Facilidad tarea (1–5)</span></div>
    <div class="stat"><span class="n">${t.facilidadMedia ?? "—"}</span><span class="l">Facilidad sesión (1–5)</span></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Distribución por rol</h3><span class="eyebrow">Reviewer es el perfil principal</span></div>
    ${ROLES.map((r) => `<div class="bar-row"><span>${r}</span>
      <div class="bar-track"><div class="bar" style="width:${t.sesiones ? (t.porRol[r] || 0) / t.sesiones * 100 : 0}%;background:var(--accent)"></div></div>
      <span class="bar-num">${t.porRol[r] || 0} sesión${(t.porRol[r] || 0) === 1 ? "" : "es"}</span></div>`).join("")}
  </div>
  <div class="card">
    <div class="card-head"><h3>Tareas con más fricción</h3><span class="eyebrow">No completadas + hallazgos altos</span></div>
    ${fr.slice(0, 10).map((v) => `<div class="bar-row"><span>${esc(v.tarea)}</span>
      <div class="bar-track"><div class="bar" style="width:${v.total / maxT * 100}%;background:${v.no || v.alta ? "var(--alta-dot)" : v.ayuda ? "var(--media-dot)" : "var(--baja-dot)"}"></div></div>
      <span class="bar-num">${v.total} obs.${v.no ? " · " + v.no + " sin completar" : ""}${v.alta ? " · " + v.alta + " alta" : ""}${v.facilidad ? " · facilidad " + v.facilidad : ""}</span></div>`).join("") || `<p class="mini">Sin tareas registradas.</p>`}
  </div>
  ${area ? `<div class="card">
    <div class="card-head"><h3>Fallos y fricciones por área</h3><span class="eyebrow">Change management = textos y comunicación</span></div>
    ${areaKeys.map((k) => `<div class="bar-row"><span>${esc(k)}</span>
      <div class="bar-track"><div class="bar" style="width:${(area[k] || 0) / maxA * 100}%;background:var(--accent)"></div></div>
      <span class="bar-num">${area[k] || 0}</span></div>`).join("")}
  </div>` : ""}
  ${d.matriz ? `<div class="card">
    <div class="card-head"><h3>Priorización · impacto × esfuerzo</h3><span class="eyebrow">Impacto = severidad · lo verde es prioritario</span></div>
    <div class="tbl-wrap"><table class="matriz">
      <thead><tr><th></th>${efCols.map((ef) => `<th>Esfuerzo ${esc(ef.toLowerCase())}</th>`).join("")}</tr></thead>
      <tbody>${SEVERIDADES.map((sv) => `<tr><th><span class="badge ${esc(sv)}"><span class="dot"></span>${esc(sv)}</span></th>
        ${efCols.map((ef) => { const n = ((d.matriz[sv] || {})[ef]) || 0; const win = sv === "Alta" && ef === "Bajo";
          return `<td class="mtz ${win ? "win" : ""}">${n ? `<span class="mtz-count">${n}</span>` : `<span class="mini">—</span>`}</td>`; }).join("")}
      </tr>`).join("")}</tbody></table></div>
    <p class="mini" style="margin-top:8px"><b>Quick wins</b> (esquina verde): alta severidad y bajo esfuerzo. El detalle de cada hallazgo se consulta en Airtable.</p>
  </div>` : ""}
  <div class="card">
    <div class="card-head"><h3>Hallazgos por rol y severidad</h3><span class="eyebrow">${totHal} en total</span></div>
    <div class="tbl-wrap"><table class="mini-tabla"><thead><tr><th>Rol</th><th>Alta</th><th>Media</th><th>Baja</th></tr></thead>
      <tbody>${ROLES.map((r) => { const h = d.hallazgos[r] || { Alta: 0, Media: 0, Baja: 0 }; return `<tr><td><span class="pill">${r}</span></td>
        <td><span class="badge Alta"><span class="dot"></span>${h.Alta}</span></td>
        <td><span class="badge Media"><span class="dot"></span>${h.Media}</span></td>
        <td><span class="badge Baja"><span class="dot"></span>${h.Baja}</span></td></tr>`; }).join("")}</tbody></table></div>
    <p class="mini" style="margin-top:9px">El texto de cada hallazgo y las citas no se publican aquí: se consultan en Airtable con acceso a la base.</p>
  </div>
  <div class="card">
    <div class="card-head"><h3>Resumen del estudio</h3></div>
    <div class="tbl-wrap"><table class="mini-tabla"><tbody>
      <tr><th>Sesiones</th><td>${t.sesiones} · ${ROLES.map((r) => `${r}: ${t.porRol[r] || 0}`).join(" · ")}</td></tr>
      <tr><th>Éxito tareas P0</th><td>${t.tasaP0}% sin ayuda (${t.p0ok} de ${t.p0total})</td></tr>
      <tr><th>Temas de insight</th><td>${(d.temas || []).length} · ${(d.temas || []).slice(0, 6).map((x) => esc(x.tema)).join(" · ") || "—"}</td></tr>
      <tr><th>Hallazgos altos por rol</th><td>${ROLES.map((r) => `${r}: ${(d.hallazgos[r] || {}).Alta || 0}`).join(" · ")}</td></tr>
      ${t.supoQueSeguia ? `<tr><th>Supo qué seguía</th><td>Sí: ${t.supoQueSeguia.Sí || 0} · No: ${t.supoQueSeguia.No || 0}</td></tr>` : ""}
    </tbody></table></div>
  </div>`;
}

/* ---- Matriz agregada: tema + recuento por rol + confianza (sin enunciados) ---- */
function renderMatriz() {
  const el = document.getElementById("v-matriz");
  if (!DATOS) { el.innerHTML = vacio(); return; }
  const temas = (DATOS.temas || []).slice().sort((a, b) => (b.roles.Reviewer + b.roles.KLD + b.roles.Consultant) - (a.roles.Reviewer + a.roles.KLD + a.roles.Consultant));
  if (!temas.length) { el.innerHTML = `<div class="empty"><p><b>Sin insights todavía.</b></p><p>La matriz agrupa los insights por tema.</p></div>`; return; }
  el.innerHTML = `<div class="card">
    <div class="card-head"><h3>Matriz de evidencia</h3><span class="eyebrow">Un tema se refuerza si aparece en varias sesiones o roles</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Tema</th><th>Rev.</th><th>KLD</th><th>Cons.</th><th>Sesiones</th><th>Confianza</th></tr></thead>
      <tbody>${temas.map((v) => `<tr><td class="w"><b>${esc(v.tema)}</b></td>
        <td>${v.roles.Reviewer || "—"}</td><td>${v.roles.KLD || "—"}</td><td>${v.roles.Consultant || "—"}</td>
        <td>${v.sesiones}</td>
        <td><span class="badge ${esc(v.confianza)}"><span class="dot"></span>${esc(v.confianza)}</span></td></tr>`).join("")}</tbody></table></div>
    <p class="mini" style="margin-top:9px">El enunciado completo de cada insight se consulta en Airtable.</p>
  </div>`;
}

/* ---- Guion completo: idéntico a la app de sesiones, desde guion.js ---- */
function htmlGuionRol(rol) {
  const g = GUION[rol];
  const est = estructuraDe(rol);
  return `<div class="card">
    <div class="card-head"><h3>${rol}${g.principal ? " · perfil principal" : ""}</h3>
      <span class="eyebrow">${est.total} min estimados</span></div>
    <p class="mini">${esc(g.objetivo)}</p>
    <div class="sect">Estructura de la sesión</div>
    <div class="tbl-wrap"><table><thead><tr><th>Momento</th><th style="width:70px">Tiempo</th><th>Contenido</th></tr></thead>
      <tbody>${est.filas.map(([a, m, c]) => `<tr><td><b>${esc(a)}</b></td><td>${m} min</td><td>${esc(c)}</td></tr>`).join("")}
        <tr><td><b>Total</b></td><td><b>${est.total} min</b></td><td class="mini">Sin contar tareas añadidas sobre la marcha.</td></tr></tbody></table></div>
    <div class="sect">Tareas y prioridades</div>
    <div class="tbl-wrap"><table><thead><tr><th style="width:90px">Prioridad</th><th>Tarea</th><th>Resultado esperado</th></tr></thead>
      <tbody>${g.tareas.map(([p, t, r, oculta]) => `<tr${oculta ? ' class="fila-oculta"' : ""}><td><span class="pill ${esc(p)}">${esc(p)}</span></td><td><b>${esc(t)}</b>${oculta ? ' <span class="pill oculta">Oculta</span>' : ""}</td><td>${esc(r)}</td></tr>`).join("")}</tbody></table></div>
    <div class="sect">Happy paths</div>
    ${g.happyPaths.map(([n, p]) => `<div class="hp"><span class="n">${esc(n)}</span><span class="p">${esc(p)}</span></div>`).join("")}
    <div class="sect">Guion</div>
    ${[g.orientacion, g.navegacion, ...g.criticas].map((b) => `<div class="blk">
      <div class="blk-head"><span class="pill ${esc(b.prioridad)}">${esc(b.prioridad)}</span>
        <span class="name">${esc(b.nombre)}</span><span class="dur">${esc(b.duracion)}</span></div>
      <div class="script"><p><b>Contexto:</b> <span class="q">«${esc(b.contexto)}»</span></p>
        <p><b>Tarea:</b> <span class="q">«${esc(b.tarea)}»</span></p>
        <p><b>Observar:</b></p><ul>${b.observar.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>
        ${b.sondeo.length ? `<p style="margin-top:6px"><b>Sondeo:</b> ${b.sondeo.map((s) => `<span class="q">«${esc(s)}»</span>`).join(" · ")}</p>` : ""}
      </div></div>`).join("")}
    ${(g.ocultas || []).length ? `<div class="sect">Fuera de alcance por ahora</div>
      ${g.ocultas.map((b) => `<div class="blk oculto">
        <div class="blk-head"><span class="pill oculta">Oculta</span><span class="name">${esc(b.nombre)}</span></div>
        <div class="script"><p class="mini">${esc(b.motivo)} El guion se conserva aquí para poder reactivarla sin rehacerla.</p>
          <p><b>Contexto:</b> <span class="q">«${esc(b.contexto)}»</span></p>
          <p><b>Tarea:</b> <span class="q">«${esc(b.tarea)}»</span></p>
        </div></div>`).join("")}` : ""}
  </div>`;
}

function renderGuion() {
  const rol = ui.guionRol || ROLES[0];
  document.getElementById("v-guion").innerHTML = `
  <div class="tabs" style="margin-bottom:14px">
    ${ROLES.map((r) => `<button class="tab ${r === rol ? "active" : ""}" data-act="guion-rol" data-v="${esc(r)}">${esc(r)}</button>`).join("")}
  </div>
  ${htmlGuionRol(rol)}
  <div class="card">
    <div class="card-head"><h3>Matriz general de permisos</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Tarea</th><th>KLD</th><th>Reviewer</th><th>Consultant</th></tr></thead>
      <tbody>${PERMISOS.map((r) => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Niveles de prioridad</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Nivel</th><th>Definición</th><th>Uso</th></tr></thead>
      <tbody>${PRIORIDADES.map(([a, b, c]) => `<tr><td><b>${esc(a)}</b></td><td>${esc(b)}</td><td>${esc(c)}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Criterio de severidad</h3></div>
    <div class="tbl-wrap"><table><tbody>${SEVERIDAD_CRITERIO.map(([s, dd]) => `<tr><th style="width:90px"><span class="badge ${s}"><span class="dot"></span>${s}</span></th><td>${esc(dd)}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Referencias de diseño</h3></div>
    <ul class="clean">${FIGMA.map(([n, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a></li>`).join("")}</ul>
  </div>`;
}

function vacio() {
  return `<div class="empty"><p><b>Aún no hay resultados publicados.</b></p>
    <p>Alguien del equipo con acceso a Airtable debe generar el snapshot desde la app de registro
    (Síntesis → «Exportar snapshot para negocio») y subir el archivo <code>datos.json</code> al repositorio.</p></div>`;
}

function irA(tab) {
  document.querySelectorAll(".tab[data-tab]").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".view").forEach((v) => v.classList.add("hide"));
  document.getElementById("v-" + tab).classList.remove("hide");
  if (tab === "sintesis") renderSintesis();
  if (tab === "matriz") renderMatriz();
  if (tab === "guion") renderGuion();
  try { window.scrollTo(0, 0); } catch (e) {}
}

document.addEventListener("click", (e) => {
  const tab = e.target.closest(".tab[data-tab]");
  if (tab) { irA(tab.dataset.tab); return; }
  const g = e.target.closest('[data-act="guion-rol"]');
  if (g) { ui.guionRol = g.dataset.v; renderGuion(); try { window.scrollTo(0, 0); } catch (err) {} }
});

function fechaTexto(iso) {
  try { return new Date(iso).toLocaleString("es-ES", { dateStyle: "long", timeStyle: "short" }); }
  catch (e) { return iso; }
}

async function cargar() {
  const aviso = document.getElementById("fecha");
  try {
    const res = await fetch("datos.json?v=" + Date.now());
    if (!res.ok) throw new Error("sin datos");
    DATOS = await res.json();
    aviso.innerHTML = `<b>Datos actualizados al ${esc(fechaTexto(DATOS.generado))}.</b> Resumen agregado; el detalle vive en Airtable.`;
  } catch (e) {
    DATOS = null;
    aviso.innerHTML = `<b>Aún no hay resultados publicados.</b> El guion completo sí está disponible en esta pestaña.`;
  }
  // La síntesis se prepara aunque esté oculta, para que el cambio de pestaña sea instantáneo.
  renderSintesis();
}

// El guion es la pestaña por defecto: se pinta ya, sin esperar al snapshot.
renderGuion();
cargar();
</script>
</body>
</html>
