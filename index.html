<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bitácora de pruebas de usabilidad · EI Tracker</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  --paper:#EEEAE0; --surface:#F8F6F0; --ink:#202A26; --ink-soft:#5B6560;
  --line:#D6D0C0; --accent:#2F5D57; --accent-soft:#E4EBE6;
  --alta-bg:#F4E3E0; --alta-fg:#8C3B32; --alta-dot:#B5453D;
  --media-bg:#F5EAD8; --media-fg:#8A5A22; --media-dot:#C98A3E;
  --baja-bg:#E6ECE3; --baja-fg:#3E5A3E; --baja-dot:#6E8F63;
  margin:0; padding:22px 18px 90px; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13.5px; line-height:1.55;
}
.wrap { max-width:900px; margin:0 auto; }
h1,h2,h3,h4 { font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace; margin:0; }
.mast { border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:14px;
  display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; }
.mast .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
.mast h1 { font-size:22px; font-weight:600; letter-spacing:-.01em; }
.mast p.sub { font-size:12.5px; color:var(--ink-soft); max-width:360px; text-align:right; margin:0; }
.note { display:flex; gap:9px; align-items:flex-start; font-size:12px; color:var(--ink-soft);
  background:var(--accent-soft); border:1px solid var(--line); padding:9px 12px; border-radius:3px;
  margin-bottom:14px; flex-wrap:wrap; }
.note.warn { background:var(--media-bg); color:var(--media-fg); border-color:var(--media-dot); }
.note.err { background:var(--alta-bg); color:var(--alta-fg); border-color:var(--alta-dot); }
.note .grow { flex:1; min-width:220px; }
.tabs { display:flex; gap:3px; border-bottom:1px solid var(--line); margin-bottom:16px; flex-wrap:wrap; }
.tab { font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase;
  letter-spacing:.06em; background:none; border:1px solid transparent; border-bottom:none;
  padding:8px 12px; cursor:pointer; color:var(--ink-soft); border-radius:3px 3px 0 0; }
.tab:hover { color:var(--ink); }
.tab.active { background:var(--surface); border-color:var(--line); color:var(--ink); font-weight:600;
  margin-bottom:-1px; padding-bottom:9px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:15px 17px; margin-bottom:13px; }
.card-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  flex-wrap:wrap; margin-bottom:11px; padding-bottom:8px; border-bottom:1px solid var(--line); }
.card-head h3 { font-size:14.5px; font-weight:600; }
.card-head .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
  text-transform:uppercase; letter-spacing:.07em; }
.sect { font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--accent); margin:16px 0 9px; padding-bottom:4px;
  border-bottom:1px solid var(--line); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px 14px; }
@media (max-width:720px){ .grid2,.grid3 { grid-template-columns:1fr; } }
label.f { display:flex; flex-direction:column; gap:4px; margin-bottom:9px; }
label.f > span.l { font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.07em; color:var(--ink-soft); }
label.f > span.h { font-size:11px; color:var(--ink-soft); font-style:italic; }
input,select,textarea { font-family:inherit; font-size:13px; color:var(--ink); background:#fff;
  border:1px solid var(--line); border-radius:3px; padding:7px 9px; width:100%; }
input:focus,select:focus,textarea:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
textarea { resize:vertical; min-height:54px; }
button { font-family:'IBM Plex Mono',monospace; cursor:pointer; }
.btn { font-size:12px; padding:7px 13px; border-radius:3px; border:1px solid var(--line);
  background:#fff; color:var(--ink); display:inline-flex; align-items:center; gap:6px; }
.btn:hover { border-color:var(--accent); }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.primary:hover { background:#254a45; }
.btn.danger { color:var(--alta-fg); border-color:var(--alta-bg); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn.sm { font-size:11px; padding:5px 9px; }
.btn.big { font-size:13px; padding:10px 18px; }
.row-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:13px; flex-wrap:wrap; align-items:center; }
.pill { font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:2px 7px; border-radius:9px;
  border:1px solid var(--line); background:#fff; color:var(--ink-soft); white-space:nowrap; }
.pill.P0 { background:var(--alta-bg); color:var(--alta-fg); border-color:var(--alta-dot); }
.pill.P1 { background:var(--media-bg); color:var(--media-fg); border-color:var(--media-dot); }
.pill.P2 { background:var(--accent-soft); color:var(--accent); }
.pill.oculta { background:transparent; color:var(--muted); border-style:dashed; }
.fila-oculta { opacity:.5; }
.fila-oculta b { text-decoration:line-through; }
.blk.oculto { opacity:.62; border-style:dashed; }
.badge { display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace;
  font-size:10.5px; padding:2px 8px; border-radius:9px; }
.badge .dot { width:6px; height:6px; border-radius:50%; }
.badge.Alta { background:var(--alta-bg); color:var(--alta-fg); } .badge.Alta .dot { background:var(--alta-dot); }
.badge.Media { background:var(--media-bg); color:var(--media-fg); } .badge.Media .dot { background:var(--media-dot); }
.badge.Baja { background:var(--baja-bg); color:var(--baja-fg); } .badge.Baja .dot { background:var(--baja-dot); }
.res { font-family:'IBM Plex Mono',monospace; font-size:11px; }
.res.ok { color:var(--baja-fg); } .res.help { color:var(--media-fg); } .res.no { color:var(--alta-fg); }

/* ---- pasos guiados ---- */
.paso { border:1px solid var(--line); border-radius:4px; background:var(--surface); margin-bottom:9px; overflow:hidden; }
.paso.open { border-color:var(--accent); box-shadow:0 1px 0 var(--accent-soft); }
.paso-head { width:100%; display:flex; align-items:center; gap:11px; padding:12px 14px;
  background:none; border:none; text-align:left; font-family:inherit; font-size:13.5px; flex-wrap:wrap; }
.paso-head:hover { background:#fff; }
.paso.open .paso-head { background:#fff; border-bottom:1px solid var(--line); }
.paso-head .num { width:23px; height:23px; border-radius:50%; background:var(--accent-soft);
  color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:11.5px; display:flex;
  align-items:center; justify-content:center; flex:none; }
.paso.done .paso-head .num { background:var(--baja-dot); color:#fff; }
.paso-head .tit { font-family:'IBM Plex Mono',monospace; font-weight:600; }
.paso-head .min { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
.paso-head .sp { flex:1; }
.paso-head .crono { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);
  background:var(--paper); padding:2px 8px; border-radius:9px; }
.paso-head .crono.over { background:var(--media-bg); color:var(--media-fg); }
.paso-head .crono.run { background:var(--accent); color:#fff; }
.paso-body { padding:14px; }

.leer { background:#fff; border:1px solid var(--accent); border-left-width:4px; border-radius:3px;
  padding:12px 14px; margin-bottom:12px; }
.leer .lbl { font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--accent); display:block; margin-bottom:5px; }
.leer p { margin:0 0 8px; font-size:14.5px; line-height:1.6; }
.leer p:last-child { margin:0; }
.leer .q { font-style:italic; }
.obs-list { background:var(--accent-soft); border-radius:3px; padding:11px 13px; margin-bottom:12px; }
.obs-list .lbl { font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--accent); display:block; margin-bottom:7px; }
.chk { display:flex; gap:8px; align-items:flex-start; margin-bottom:5px; font-size:12.5px; cursor:pointer; }
.chk input { width:15px; height:15px; margin:2px 0 0; flex:none; accent-color:var(--accent); }
.chk.on { color:var(--accent); font-weight:500; }
.opts { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px; }
.opt { font-size:12.5px; padding:9px 14px; border-radius:3px; border:1px solid var(--line);
  background:#fff; color:var(--ink-soft); }
.opt:hover { border-color:var(--accent); }
.opt.on { border-color:var(--accent); background:var(--accent); color:#fff; font-weight:600; }
.opt.on.ok { background:var(--baja-fg); border-color:var(--baja-fg); }
.opt.on.help { background:var(--media-fg); border-color:var(--media-fg); }
.opt.on.no { background:var(--alta-fg); border-color:var(--alta-fg); }
.opt.num { min-width:44px; justify-content:center; text-align:center; }
.masdet { border-top:1px dashed var(--line); margin-top:10px; padding-top:10px; }
.toggle { background:none; border:none; color:var(--accent); font-size:11.5px; padding:0;
  text-decoration:underline; font-family:'IBM Plex Mono',monospace; }
.paso-next { display:flex; justify-content:space-between; align-items:center; gap:9px;
  margin-top:13px; padding-top:11px; border-top:1px solid var(--line); flex-wrap:wrap; }

/* ---- chuleta flotante ---- */
.chuleta-btn { position:fixed; right:16px; bottom:16px; z-index:40; background:var(--accent);
  color:#fff; border:none; border-radius:22px; padding:11px 17px; font-size:12.5px;
  box-shadow:0 4px 16px rgba(0,0,0,.22); }
.chuleta { position:fixed; right:16px; bottom:62px; z-index:41; width:310px; max-width:calc(100vw - 32px);
  max-height:65vh; overflow-y:auto; background:#fff; border:1px solid var(--accent); border-radius:5px;
  padding:14px 15px; box-shadow:0 8px 30px rgba(0,0,0,.24); }
.chuleta h4 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin:0 0 6px; }
.chuleta h4:not(:first-child) { margin-top:13px; }
.chuleta ul { margin:0; padding-left:16px; font-size:12.5px; } .chuleta li { margin-bottom:3px; }
.chuleta .no li { color:var(--alta-fg); }

table { width:100%; border-collapse:collapse; font-size:12.5px; }
th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.07em; color:var(--ink-soft); background:var(--accent-soft); }
td.w { min-width:170px; }
.tbl-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:3px; background:var(--surface); }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(125px,1fr)); gap:9px; margin-bottom:14px; }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:11px 13px; }
.stat .n { font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; display:block; }
.stat .l { font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;
  font-family:'IBM Plex Mono',monospace; }
.bar-row { display:grid; grid-template-columns:1fr 140px 100px; gap:10px; align-items:center; margin-bottom:6px; font-size:12.5px; }
.bar-track { height:9px; background:#E3DFD3; border-radius:5px; overflow:hidden; }
.bar { height:100%; border-radius:5px; }
.bar-num { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
@media (max-width:700px){ .bar-row { grid-template-columns:1fr; gap:3px; } }

table.matriz td.mtz.win { background:var(--baja-bg); }
.mtz-item { font-size:11px; background:var(--surface); border:1px solid var(--line); border-radius:3px;

.sess { border:1px solid var(--line); border-radius:3px; background:var(--surface); margin-bottom:8px; }
.sess-head { width:100%; display:flex; align-items:center; gap:10px; padding:10px 13px; background:none;

.sess-head:hover { background:#fff; }
.sess-head .id { font-family:'IBM Plex Mono',monospace; font-weight:600; }
.sess-head .meta { font-size:11.5px; color:var(--ink-soft); }
.sess-head .sp { flex:1; }
.sess-body { padding:0 14px 14px; border-top:1px solid var(--line); }
.obs { border-left:2px solid var(--line); padding:8px 0 8px 12px; margin-top:10px; }
.obs p { margin:3px 0; font-size:12.5px; }
.obs .quote { font-style:italic; color:var(--accent); border-left:2px solid var(--accent-soft); padding-left:8px; }
.empty { text-align:center; padding:36px 20px; color:var(--ink-soft); background:var(--surface);

.filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:11px; }
.filters input,.filters select { width:auto; min-width:130px; }
.filters .search { flex:1; min-width:200px; }
.hide { display:none !important; }
.spin { display:inline-block; width:12px; height:12px; border:2px solid var(--line);

@keyframes sp { to { transform:rotate(360deg); } }
.overlay { position:fixed; inset:0; background:rgba(32,42,38,.45); display:flex; align-items:center;
  justify-content:center; z-index:50; padding:20px; }
.modal { background:#fff; border-radius:5px; padding:20px 22px; max-width:360px; box-shadow:0 10px 40px rgba(0,0,0,.2); }
.modal p { margin:0 0 16px; font-size:13px; }
.toast { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:var(--ink);
  color:#fff; padding:10px 16px; border-radius:4px; font-size:12.5px; z-index:60;
  font-family:'IBM Plex Mono',monospace; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:90vw; }
.toast.err { background:var(--alta-dot); }
.mini { font-size:11.5px; color:var(--ink-soft); }
ul.clean { margin:5px 0 0; padding-left:17px; font-size:12.5px; }
ul.clean li { margin-bottom:3px; }
.hp { background:#fff; border:1px solid var(--line); border-radius:3px; padding:9px 11px; margin-bottom:7px; }
.hp .n { font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; display:block; margin-bottom:3px; }
.hp .p { font-size:12px; color:var(--ink-soft); }
.item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
.item-head .ix { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent);
  text-transform:uppercase; letter-spacing:.07em; }
.blk { border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:3px;
  background:#fff; padding:13px 15px; margin-bottom:11px; }
.blk-head { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:9px; }
.blk-head .name { font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; }
.blk-head .dur { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
.script { background:var(--accent-soft); border-radius:3px; padding:10px 12px; margin-bottom:11px; font-size:12.5px; }
.script p { margin:0 0 6px; } .script p:last-child { margin:0; }
.script .q { font-style:italic; }
.script ul { margin:4px 0 0; padding-left:17px; }
</style>
</head>

<div class="wrap">
  <div class="mast">

</div>
<div id="chuleta-host"></div>
<button class="chuleta-btn" data-act="chuleta">Chuleta del facilitador</button>

function bloquesDeSesion(rol) {
  const g = GUION[rol];
  if (!g) return [];
  return [
    { bloque:"Orientación", ...g.orientacion },
    { bloque:"Navegación común", ...g.navegacion },
    ...g.criticas.map((c) => ({ bloque:"Tarea crítica", ...c }))
  ];
}

/* Minutos que declara un bloque ("10 min" -> 10). */
const minutosDe = (b) => Number(String((b && b.duracion) || "").match(/\d+/) || [0]) || 0;

/* Estructura de la sesión para un rol concreto: los tiempos dependen de
   cuántas tareas críticas tenga el rol, así que se calculan, no se fijan. */
function estructuraDe(rol) {
  const g = GUION[rol];
  const filas = [
    ["Apertura", 3, "Contexto, consentimiento y pregunta inicial."],
    ["Orientación", minutosDe(g.orientacion), "Comprender la página de inicio y las prioridades."],
    ["Navegación común", minutosDe(g.navegacion), "Filtrar, localizar y abrir una EI."],
    ...g.criticas.map((c) => ["Tarea crítica · " + c.nombre, minutosDe(c), c.tarea]),
    ["Cierre", 5, "Evaluación y preguntas finales."]
  ];
  return { filas, total: filas.reduce((a, f) => a + f[1], 0) };
}
/* ===================== Conexión directa con Airtable (API REST) =====================
   Esta versión NO depende de Cowork. Cada persona pega su propio token de Airtable
   (Personal Access Token) la primera vez que abre la página. El token se guarda
   solo en su navegador (localStorage) y nunca se sube a GitHub ni se comparte
   con nadie más. Más info: ver README.md del repositorio. */
let ultimoError = "";
const TOKEN_KEY = "ei-tracker-airtable-token";

function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t.trim()); } catch (e) {} }
function borrarToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

async function airtableFetch(path, options) {
  const token = getToken();
  if (!token) { const e = new Error("Falta el token de Airtable."); e.sinToken = true; throw e; }
  const res = await fetch("https://api.airtable.com/v0/" + BASE + path, {
    ...options,
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json", ...(options && options.headers) }
  });
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) {
    const msg = (body && body.error && (body.error.message || body.error.type)) || ("HTTP " + res.status);
    const e = new Error(msg);
    e.status = res.status;
    throw e;
  }
  return body;
}

// La API REST de Airtable usa nombres de campo (no fldXXXX) al leer/escribir por nombre de tabla.
// Convertimos los mapas F.* (que en el resto del código son IDs) a nombres reales una sola vez.
const NOMBRE_TABLA = { [T.ses]: "Sesiones", [T.tar]: "Registro por tarea", [T.hal]: "Hallazgos", [T.ins]: "Insights" };

async function listRecords(tableId) {
  let records = [], offset;
  do {
    const qs = offset ? "?pageSize=100&offset=" + encodeURIComponent(offset) : "?pageSize=100";
    const r = await conReintento(() => airtableFetch("/" + encodeURIComponent(NOMBRE_TABLA[tableId]) + qs));
    records = records.concat((r.records || []).map(normalizarRegistro));
    offset = r.offset;
  } while (offset);
  return { records };
}

function normalizarRegistro(rec) {
  // homogeneiza para que val(rec, fieldId) siga funcionando: cellValuesByFieldId se llena
  // buscando, para cada fieldId conocido, el campo por NOMBRE dentro de rec.fields.
  return { id: rec.id, fields: rec.fields, cellValuesByFieldId: rec.fields };
}

async function createRecords(tableId, records) {
  const porNombre = records.map((r) => ({ fields: aFieldsPorNombre(tableId, r.fields) }));
  const out = [];
  for (let i = 0; i < porNombre.length; i += 10) {
    const lote = porNombre.slice(i, i + 10);
    const r = await conReintento(() => airtableFetch("/" + encodeURIComponent(NOMBRE_TABLA[tableId]), { method: "POST", body: JSON.stringify({ records: lote, typecast: true }) }));
    out.push(...(r.records || []).map(normalizarRegistro));
  }
  return { records: out };
}

async function updateRecords(tableId, records) {
  const porNombre = records.map((r) => ({ id: r.id, fields: aFieldsPorNombre(tableId, r.fields) }));
  const out = [];
  for (let i = 0; i < porNombre.length; i += 10) {
    const lote = porNombre.slice(i, i + 10);
    const r = await conReintento(() => airtableFetch("/" + encodeURIComponent(NOMBRE_TABLA[tableId]), { method: "PATCH", body: JSON.stringify({ records: lote, typecast: true }) }));
    out.push(...(r.records || []).map(normalizarRegistro));
  }
  return { records: out };
}

async function deleteRecords(tableId, recordIds) {
  const out = [];
  for (let i = 0; i < recordIds.length; i += 10) {
    const lote = recordIds.slice(i, i + 10);
    const qs = lote.map((id) => "records[]=" + encodeURIComponent(id)).join("&");
    const r = await conReintento(() => airtableFetch("/" + encodeURIComponent(NOMBRE_TABLA[tableId]) + "?" + qs, { method: "DELETE" }));
    out.push(...(r.records || []));
  }
  return { records: out };
}

async function conReintento(fn) {
  let ultima = null;
  for (let intento = 0; intento < 2; intento++) {
    try { return await fn(); }
    catch (e) {
      ultima = e;
      if (e.sinToken || e.status === 401 || e.status === 403) break; // no reintentar si el token está mal
      await new Promise((r) => setTimeout(r, 700));
    }
  }
  ultimoError = ultima ? ultima.message : "sin respuesta";
  throw ultima || new Error("Sin respuesta de Airtable");
}

function aFieldsPorNombre(tableId, fieldsPorId) {
  const out = {};
  Object.keys(fieldsPorId).forEach((fid) => {
    const nombre = NOMBRE_CAMPO[fid];
    if (!nombre) return; // campo sin mapeo conocido: se omite en vez de romper el guardado
    out[nombre] = fieldsPorId[fid];
  });
  return out;
}

function val(rec, fid) {
  const nombre = NOMBRE_CAMPO[fid];
  const src = rec.cellValuesByFieldId || rec.fields || {};
  const v = nombre ? src[nombre] : undefined;
  if (v === undefined || v === null) return "";
  if (Array.isArray(v)) {
    if (v.length && typeof v[0] === "object" && v[0] && "name" in v[0]) return v.map((x) => x.name);
    return v;
  }
  if (typeof v === "object") return v.name ?? "";
  return v;
}

/* Reconstruye la lista de tareas a partir del guion del rol activo.
   El emparejamiento es por nombre, no por posición, porque cada rol tiene
   un número distinto de tareas críticas. Las tareas añadidas a mano se
   conservan siempre y van al final. */
function sincronizarTareas() {
  const prev = draft.tareas || [];
  const extras = prev.filter((t) => t.extra);
  const base = bloquesDeSesion(draft.ficha.rol).map((bl) => {
    const p = prev.find((t) => !t.extra && t.bloque === bl.bloque && t.tarea === bl.nombre);
    return p ? { ...p, prioridad: bl.prioridad, _ref: bl } : nuevaFila(bl);
  });
  draft.tareas = [...base, ...extras];
}

function getPath(o, path) { return path.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
function metricasCalculadas(ts) {

/* ===================== Cronómetros ===================== */
function crono(id) { return timers[id] || (timers[id] = { ms: 0, desde: null }); }
function cronoMs(id) { const t = crono(id); return t.ms + (t.desde ? Date.now() - t.desde : 0); }
function cronoTexto(id) {
  const ms = cronoMs(id);
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
setInterval(() => {
  Object.keys(timers).forEach((id) => {
    const el = document.getElementById("crono-" + id);
    if (!el) return;
    el.textContent = cronoTexto(id);
    const t = timers[id];
    const min = Number(el.dataset.min || 0);
    const ms = t.ms + (t.desde ? Date.now() - t.desde : 0);
    el.className = "crono" + (t.desde ? " run" : "") + (min && ms > min * 60000 ? " over" : "");
  });
}, 1000);

   rol y de cuántas se hayan añadido a mano. El índice va en el id (t0, t1,
   … t12), así que hay que leerlo con slice(1) y no con [1]. */
function pasos() {
  const tareas = draft.tareas.map((t, i) => ({
    id: "t" + i,
    tit: t.extra ? (t.tarea.trim() || "Tarea adicional") : t.tarea,
    min: minutosDe(t._ref)
  }));
  return [
    { id: "apertura", tit: "Apertura", min: 3 },
    ...tareas,
    { id: "cierre", tit: "Cierre", min: 5 },
    { id: "despues", tit: "Después de la sesión", min: 0 }
  ].map((p, i) => ({ ...p, n: i + 1 }));
}

function pasoHecho(p) {
  if (p.id === "apertura") return !!draft.respInicial.trim();
  if (p.id.startsWith("t")) { const t = draft.tareas[Number(p.id.slice(1))]; return !!(t && t.resultado); }
  if (p.id === "cierre") return !!(draft.metricas.facilidad || draft.cierre.confuso.trim() || draft.cierre.cambio.trim());
  if (p.id === "despues") return !!(draft.sintesis.resultado.trim() || draft.hallazgos.length);
  return false;
}

function fichaFields(idSesion) {
  const f = draft.ficha, m = metricasCalculadas(draft.tareas), mm = draft.metricas, c = draft.cierre, s = draft.sintesis;
  const num = (v) => (v === "" || v === null || v === undefined ? undefined : Number(v));
  const crit = draft.tareas.filter((t) => t.bloque === "Tarea crítica" && t.tarea).map((t) => t.tarea).join(" · ");
  const o = {};
  o[F.ses.id] = idSesion;
  o[F.ses.fecha] = f.fecha || undefined;
  o[F.ses.hora] = f.hora;
  o[F.ses.rol] = f.rol;
  o[F.ses.participante] = f.participante;
  o[F.ses.modalidad] = "Remota";
  /* El campo "Variante" (single select A/B/C) ya no aplica: desde ahora cada
     sesión evalúa todas las tareas críticas del rol, no una de tres. */
  o[F.ses.varianteTxt] = crit;
  o[F.ses.consentimiento] = f.consentimiento;
  if (f.grabacion) o[F.ses.grabacion] = f.grabacion;
  o[F.ses.incidencias] = f.incidencias;
  o[F.ses.respInicial] = draft.respInicial;
  o[F.ses.mSinAyuda] = m.sin; o[F.ses.mConAyuda] = m.con; o[F.ses.mNoCompl] = m.no;
  o[F.ses.mErrores] = num(mm.errores); o[F.ses.mRetrocesos] = num(mm.retrocesos);
  o[F.ses.mFacilidad] = num(mm.facilidad); o[F.ses.mConfianza] = num(mm.confianza);
  o[F.ses.cConfuso] = c.confuso; o[F.ses.cSiguiente] = c.siguiente; o[F.ses.cFaltante] = c.faltante; o[F.ses.cCambio] = c.cambio;
  o[F.ses.cSupo] = c.supo || undefined;
  o[F.ses.sObjetivo] = s.objetivo; o[F.ses.sResultado] = s.resultado; o[F.ses.sNecesidad] = s.necesidad;
  o[F.ses.sDificultad] = s.dificultad; o[F.ses.sClaro] = s.claro; o[F.ses.sRiesgo] = s.riesgo;
  o[F.ses.preguntas] = draft.preguntas;
  o[F.ses.creado] = new Date().toISOString();
  Object.keys(o).forEach((k) => { if (o[k] === undefined) delete o[k]; });
  return o;
}

async function guardarSesion() {
  const f = draft.ficha;
  if (!f.participante.trim()) { toast("Escribe con quién fue la sesión (participante)", true); return; }
  const btn = document.getElementById("btn-guardar");
  btn.disabled = true; btn.textContent = "Guardando…";
  const idSesion = draft.recId ? draft.idSesion : siguienteId(f.rol);
  try {
    let recId = draft.recId;
    if (recId) {
      await updateRecords(T.ses, [{ id: recId, fields: fichaFields(idSesion) }]);
      const del = [[T.tar, draft.childIds.tar], [T.hal, draft.childIds.hal], [T.ins, draft.childIds.ins]];
      for (const [tid, arr] of del) if (arr && arr.length) await deleteRecords(tid, arr);
    } else {
      const r = await createRecords(T.ses, [{ fields: fichaFields(idSesion) }]);
      recId = r.records[0].id;
    }

    const tareas = draft.tareas.filter((t) => t.tarea).map((t) => {
      const marcados = ((t._ref && t._ref.observar) || []).filter((_, j) => t.observados && t.observados[j]);
      const sondeo = ((t._ref && t._ref.sondeo) || []).map((q, j) => {
        const a = (t.sondeoResp && t.sondeoResp[j]) || "";
        return a.trim() ? `Sondeo «${q}»: ${a.trim()}` : "";
      }).filter(Boolean).join("\n");
      const obs = [
        t.extra && t.consigna ? "Consigna: " + t.consigna : "",
        marcados.length ? "Observado: " + marcados.join(" · ") : "",
        sondeo,
        t.observacion || ""
      ].filter(Boolean).join("\n");
      const o = {};
      o[F.tar.registro] = `${idSesion} · ${t.tarea}`;
      o[F.tar.sesion] = [recId]; o[F.tar.idSesion] = idSesion; o[F.tar.rol] = f.rol;
      o[F.tar.bloque] = t.bloque; o[F.tar.tarea] = t.tarea; o[F.tar.prioridad] = t.prioridad;
      if (t.resultado) o[F.tar.resultado] = t.resultado;
      o[F.tar.tiempo] = t.tiempo; o[F.tar.ruta] = t.ruta; o[F.tar.primerClic] = t.primerClic;
      o[F.tar.errores] = t.errores; o[F.tar.bloqueo] = t.bloqueo; o[F.tar.ayuda] = t.ayuda;
      o[F.tar.expectativa] = t.expectativa; o[F.tar.interpreto] = t.interpreto;
      o[F.tar.cita] = t.cita; o[F.tar.observacion] = obs;
      if (t.facilidad !== "" && t.facilidad != null) o[F.tar.facilidad] = Number(t.facilidad);
      return { fields: o };
    });
    const hallazgos = draft.hallazgos.filter((h) => h.hallazgo || h.evidencia).map((h) => {
      const o = {};
      o[F.hal.id] = `${idSesion} · ${h.codigo}`; o[F.hal.sesion] = [recId];
      o[F.hal.idSesion] = idSesion; o[F.hal.rol] = f.rol; o[F.hal.tarea] = h.tarea;
      o[F.hal.hallazgo] = h.hallazgo; o[F.hal.evidencia] = h.evidencia; o[F.hal.impacto] = h.impacto;
      o[F.hal.severidad] = h.severidad; o[F.hal.recomendacion] = h.recomendacion;
      if (h.area) o[F.hal.area] = h.area;
      if (h.esfuerzo) o[F.hal.esfuerzo] = h.esfuerzo;
      return { fields: o };
    });
    const insights = draft.insights.filter((n) => n.necesidad || n.barrera).map((n) => {
      const o = {};
      o[F.ins.id] = `${idSesion} · ${n.codigo}`; o[F.ins.sesion] = [recId];
      o[F.ins.idSesion] = idSesion; o[F.ins.rol] = f.rol;
      o[F.ins.insight] = `La persona necesita ${n.necesidad} porque ${n.motivacion}, pero ${n.barrera}, lo que provoca ${n.consecuencia}.`;
      o[F.ins.necesidad] = n.necesidad; o[F.ins.motivacion] = n.motivacion;
      o[F.ins.barrera] = n.barrera; o[F.ins.consecuencia] = n.consecuencia;
      o[F.ins.confianza] = n.confianza; o[F.ins.tema] = n.tema || n.necesidad;
      return { fields: o };
    });
    if (tareas.length) await createRecords(T.tar, tareas);
    if (hallazgos.length) await createRecords(T.hal, hallazgos);
    if (insights.length) await createRecords(T.ins, insights);

    toast("Sesión " + idSesion + " guardada en Airtable");
    draft = nuevoDraft(); sincronizarTareas(); guardarBorrador();
    Object.keys(timers).forEach((k) => delete timers[k]);
    ui.pasoAbierto = "apertura";
    await cargarDatos();
    irA("sesiones");
  } catch (e) {
    toast("No se pudo guardar: " + e.message + " — tu borrador sigue aquí", true);
    btn.disabled = false; btn.textContent = draft.recId ? "Guardar cambios" : "Guardar sesión";
  }
}

/* ===================== Cargar datos ===================== */
async function cargarDatos() {
  const s = await listRecords(T.ses);
  const t = await listRecords(T.tar);
  const h = await listRecords(T.hal);
  const n = await listRecords(T.ins);
  state.sessions = (s.records || []).sort((a, b) => String(val(b, F.ses.creado)).localeCompare(String(val(a, F.ses.creado))));
  state.tareas = t.records || []; state.hallazgos = h.records || []; state.insights = n.records || [];
  state.conectado = true;
  document.getElementById("cnt-sess").textContent = "(" + state.sessions.length + ")";
  const c = document.getElementById("conn");
  c.className = "note";
  c.innerHTML = `<span>◈</span><span class="grow">Conectado a Airtable · ${state.sessions.length} ${state.sessions.length === 1 ? "sesión" : "sesiones"}, ${state.hallazgos.length} hallazgos, ${state.insights.length} insights guardados.</span>`;
}

function bannerError(e) {
  state.conectado = false;
  const c = document.getElementById("conn");
  if (e && e.sinToken) {
    c.className = "note warn";
    c.innerHTML = `<span>🔑</span><span class="grow"><b>Falta tu token de Airtable.</b> Pégalo para conectar con la base compartida del equipo.</span>
      <button class="btn sm primary" data-act="config-token">Configurar token</button>`;
    return;
  }
  c.className = "note err";
  const esAuth = e && (e.status === 401 || e.status === 403);
  c.innerHTML = `<span>⚠</span><span class="grow"><b>No se pudo conectar con Airtable.</b> ${esAuth ? "Tu token parece inválido o sin acceso a esta base." : "Puedes seguir moderando: todo lo que escribas se guarda en este navegador y podrás guardarlo cuando vuelva la conexión."}<br><span class="mini">Detalle: ${esc(e.message || String(e))}${ultimoError ? " · " + esc(ultimoError) : ""}</span></span>
    <button class="btn sm" data-act="reintentar">Reintentar</button>
    <button class="btn sm" data-act="config-token">${esAuth ? "Cambiar token" : "Configurar token"}</button>`;
}

/* ===================== Vista: Síntesis ===================== */
const filtros = { rol: "Todos", severidad: "Todas", q: "" };

function renderSintesis() {
  const el = document.getElementById("v-sintesis");
  // Barra para publicar el snapshot en la vista de Resultados (resultados.html).
  // Siempre visible cuando hay conexión, con o sin sesiones, para que se encuentre.
  const barraSnapshot = state.conectado ? `<div class="card">
    <div class="row-actions" style="justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span class="mini">Publica los resultados (solo agregados) en la <b>vista de Resultados</b> para negocio y producto, sin que necesiten token.</span>
      <button class="btn sm primary" data-act="export-snapshot">Exportar snapshot para negocio</button>
    </div>
  </div>` : "";

  if (!state.sessions.length) {
    el.innerHTML = barraSnapshot + `<div class="empty"><p><b>Sin datos todavía.</b></p>
      <p>La síntesis se construye con las sesiones guardadas. En cuanto guardes la primera, aquí podrás publicar los resultados con el botón de arriba.</p></div>`;
    return;
  }
  const porRol = {}; ROLES.forEach((r) => porRol[r] = state.sessions.filter((s) => val(s, F.ses.rol) === r).length);
  const p0 = state.tareas.filter((t) => val(t, F.tar.prioridad) === "P0" && val(t, F.tar.resultado));
  const p0ok = p0.filter((t) => val(t, F.tar.resultado) === "Éxito sin ayuda").length;
  const tasa = p0.length ? Math.round((p0ok / p0.length) * 100) : 0;
  const noCompl = state.tareas.filter((t) => val(t, F.tar.resultado) === "No completada").length;
  const altas = state.hallazgos.filter((h) => val(h, F.hal.severidad) === "Alta").length;
  const fac = state.sessions.map((s) => Number(val(s, F.ses.mFacilidad))).filter((n) => n > 0);
  const facProm = fac.length ? (fac.reduce((a, b) => a + b, 0) / fac.length).toFixed(1) : "—";
  const facTareas = state.tareas.map((t) => Number(val(t, F.tar.facilidad))).filter((n) => n > 0);
  const facTareaProm = facTareas.length ? (facTareas.reduce((a, b) => a + b, 0) / facTareas.length).toFixed(1) : "—";

  const mapa = {};
  state.tareas.forEach((t) => {
    const k = val(t, F.tar.tarea); if (!k) return;
    mapa[k] = mapa[k] || { total: 0, no: 0, ayuda: 0, alta: 0, facSum: 0, facN: 0 };
    mapa[k].total++;
    if (val(t, F.tar.resultado) === "No completada") mapa[k].no++;
    if (val(t, F.tar.resultado) === "Éxito con ayuda") mapa[k].ayuda++;
    const fv = Number(val(t, F.tar.facilidad));
    if (fv > 0) { mapa[k].facSum += fv; mapa[k].facN++; }
  });
  state.hallazgos.forEach((h) => { const k = val(h, F.hal.tarea); if (k && mapa[k] && val(h, F.hal.severidad) === "Alta") mapa[k].alta++; });
  const orden = Object.entries(mapa).sort((a, b) => (b[1].no + b[1].alta) - (a[1].no + a[1].alta) || b[1].total - a[1].total);
  const maxT = Math.max(1, ...orden.map(([, v]) => v.total));

  // Clasificación por área y matriz severidad × esfuerzo (peer review).
  const porArea = {}; AREAS.forEach((x) => porArea[x] = 0); porArea["Sin clasificar"] = 0;
  state.hallazgos.forEach((h) => { const ar = val(h, F.hal.area); porArea[AREAS.includes(ar) ? ar : "Sin clasificar"]++; });
  const celda = (sv, ef) => state.hallazgos.filter((h) => (val(h, F.hal.severidad) || "Media") === sv && (ESFUERZOS.includes(val(h, F.hal.esfuerzo)) ? val(h, F.hal.esfuerzo) : "Sin estimar") === ef);

  const hF = state.hallazgos.filter((h) => {
    if (filtros.rol !== "Todos" && val(h, F.hal.rol) !== filtros.rol) return false;
    if (filtros.severidad !== "Todas" && val(h, F.hal.severidad) !== filtros.severidad) return false;
    if (filtros.q.trim()) {
      const hay = [F.hal.hallazgo, F.hal.evidencia, F.hal.impacto, F.hal.recomendacion, F.hal.tarea, F.hal.idSesion].map((f) => val(h, f)).join(" ").toLowerCase();
      if (!hay.includes(filtros.q.toLowerCase())) return false;
    }
    return true;
  });

  el.innerHTML = `
  <div class="stats">
    <div class="stat"><span class="n">${state.sessions.length}</span><span class="l">Sesiones</span></div>
    <div class="stat"><span class="n">${tasa}%</span><span class="l">Éxito P0 sin ayuda</span></div>
    <div class="stat"><span class="n">${noCompl}</span><span class="l">No completadas</span></div>
    <div class="stat" style="border-color:var(--alta-dot)"><span class="n" style="color:var(--alta-fg)">${altas}</span><span class="l">Hallazgos altos</span></div>
    <div class="stat"><span class="n">${state.insights.length}</span><span class="l">Insights</span></div>
    <div class="stat"><span class="n">${facTareaProm}</span><span class="l">Facilidad tarea (1–5)</span></div>
    <div class="stat"><span class="n">${facProm}</span><span class="l">Facilidad sesión (1–5)</span></div>
  </div>
  ${barraSnapshot}
  <div class="card">
    <div class="card-head"><h3>Distribución por rol</h3><span class="eyebrow">Reviewer es el perfil principal</span></div>
    ${ROLES.map((r) => `<div class="bar-row"><span>${r}</span>
      <div class="bar-track"><div class="bar" style="width:${state.sessions.length ? porRol[r] / state.sessions.length * 100 : 0}%;background:var(--accent)"></div></div>
      <span class="bar-num">${porRol[r]} sesión${porRol[r] === 1 ? "" : "es"}</span></div>`).join("")}
  </div>
  <div class="card">
    <div class="card-head"><h3>Tareas con más fricción</h3><span class="eyebrow">No completadas + hallazgos altos</span></div>
    ${orden.slice(0, 10).map(([k, v]) => `<div class="bar-row"><span>${esc(k)}</span>
      <div class="bar-track"><div class="bar" style="width:${v.total / maxT * 100}%;background:${v.no || v.alta ? "var(--alta-dot)" : v.ayuda ? "var(--media-dot)" : "var(--baja-dot)"}"></div></div>
      <span class="bar-num">${v.total} obs.${v.no ? " · " + v.no + " sin completar" : ""}${v.alta ? " · " + v.alta + " alta" : ""}${v.facN ? " · facilidad " + (v.facSum / v.facN).toFixed(1) : ""}</span></div>`).join("") || `<p class="mini">Sin tareas registradas.</p>`}
  </div>
  <div class="card">
    <div class="card-head"><h3>Fallos y fricciones por área</h3><span class="eyebrow">Change management = textos y comunicación</span></div>
    ${state.hallazgos.length ? [...AREAS, "Sin clasificar"].map((ar) => `<div class="bar-row"><span>${esc(ar)}</span>
      <div class="bar-track"><div class="bar" style="width:${porArea[ar] / Math.max(1, state.hallazgos.length) * 100}%;background:var(--accent)"></div></div>
      <span class="bar-num">${porArea[ar]}</span></div>`).join("") : `<p class="mini">Sin hallazgos todavía.</p>`}
  </div>
  <div class="card">
    <div class="card-head"><h3>Priorización · impacto × esfuerzo</h3><span class="eyebrow">Impacto = severidad · lo verde es prioritario</span></div>
    ${state.hallazgos.length ? `<div class="tbl-wrap"><table class="matriz">
      <thead><tr><th></th>${[...ESFUERZOS, "Sin estimar"].map((ef) => `<th>Esfuerzo ${esc(ef.toLowerCase())}</th>`).join("")}</tr></thead>
      <tbody>${SEVERIDADES.map((sv) => `<tr><th><span class="badge ${esc(sv)}"><span class="dot"></span>${esc(sv)}</span></th>
        ${[...ESFUERZOS, "Sin estimar"].map((ef) => { const cel = celda(sv, ef); const quickWin = sv === "Alta" && ef === "Bajo";
          return `<td class="mtz ${quickWin ? "win" : ""}">${cel.length ? cel.map((h) => `<div class="mtz-item" title="${esc(val(h, F.hal.hallazgo))}">${esc(val(h, F.hal.idSesion))} · ${esc((val(h, F.hal.hallazgo) || "").slice(0, 40))}${(val(h, F.hal.hallazgo) || "").length > 40 ? "…" : ""}</div>`).join("") : `<span class="mini">—</span>`}</td>`; }).join("")}
      </tr>`).join("")}</tbody></table></div>
      <p class="mini" style="margin-top:8px"><b>Quick wins</b> (esquina verde): alta severidad y bajo esfuerzo — cámbialos primero. Marca el <b>esfuerzo</b> en cada hallazgo para colocarlo en la matriz.</p>`
      : `<p class="mini">Sin hallazgos todavía.</p>`}
  </div>
  <div class="card">
    <div class="card-head"><h3>Hallazgos</h3><span class="eyebrow">${hF.length} de ${state.hallazgos.length}</span></div>
    <div class="filters">
      <input class="search" type="text" id="f-q" placeholder="Buscar…" value="${esc(filtros.q)}">
      <select id="f-rol">${opts(["Todos", ...ROLES], filtros.rol)}</select>
      <select id="f-sev">${opts(["Todas", ...SEVERIDADES], filtros.severidad)}</select>
      <button class="btn sm" data-act="export-hallazgos">Exportar CSV</button>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Sesión</th><th>Rol</th><th>Tarea</th><th>Sev.</th><th>Área</th><th>Esf.</th><th>Hallazgo</th><th>Recomendación</th></tr></thead>
      <tbody>${hF.map((h) => `<tr><td>${esc(val(h, F.hal.idSesion))}</td>
        <td><span class="pill">${esc(val(h, F.hal.rol))}</span></td>
        <td>${esc(val(h, F.hal.tarea))}</td>
        <td><span class="badge ${esc(val(h, F.hal.severidad))}"><span class="dot"></span>${esc(val(h, F.hal.severidad))}</span></td>
        <td>${esc(val(h, F.hal.area)) || "—"}</td>
        <td>${esc(val(h, F.hal.esfuerzo)) || "—"}</td>
        <td class="w">${esc(val(h, F.hal.hallazgo))}</td><td class="w">${esc(val(h, F.hal.recomendacion))}</td></tr>`).join("")
        || `<tr><td colspan="8" class="mini">No hay hallazgos con estos filtros.</td></tr>`}</tbody></table></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Resumen final del estudio</h3></div>

    g[k] = g[k] || { insights: [], roles: { Reviewer: 0, KLD: 0, Consultant: 0 }, sesiones: new Set(), conf: [] };
    g[k].insights.push(n);

/* ===================== Snapshot para negocio/producto =====================
   Genera datos.json para la vista pública (resultados.html), que NO usa token.
   Contiene SOLO agregados: métricas, fricción por tarea y temas de insight.
   No incluye el texto literal de hallazgos, citas ni la síntesis por sesión,
   para no publicar contenido de participantes en un repositorio público. */
function construirSnapshot() {
  const porRol = {}; ROLES.forEach((r) => porRol[r] = state.sessions.filter((s) => val(s, F.ses.rol) === r).length);
  const p0 = state.tareas.filter((t) => val(t, F.tar.prioridad) === "P0" && val(t, F.tar.resultado));
  const p0ok = p0.filter((t) => val(t, F.tar.resultado) === "Éxito sin ayuda").length;
  const noCompl = state.tareas.filter((t) => val(t, F.tar.resultado) === "No completada").length;
  const altas = state.hallazgos.filter((h) => val(h, F.hal.severidad) === "Alta").length;
  const fac = state.sessions.map((s) => Number(val(s, F.ses.mFacilidad))).filter((n) => n > 0);
  const supo = { Sí: 0, No: 0 };
  state.sessions.forEach((s) => { const v = val(s, F.ses.cSupo); if (supo[v] !== undefined) supo[v]++; });

  const mapa = {};
  const facTodas = [];
  state.tareas.forEach((t) => {
    const k = val(t, F.tar.tarea); if (!k) return;
    mapa[k] = mapa[k] || { total: 0, no: 0, ayuda: 0, alta: 0, facSum: 0, facN: 0 };
    mapa[k].total++;
    if (val(t, F.tar.resultado) === "No completada") mapa[k].no++;
    if (val(t, F.tar.resultado) === "Éxito con ayuda") mapa[k].ayuda++;
    const fv = Number(val(t, F.tar.facilidad));
    if (fv > 0) { mapa[k].facSum += fv; mapa[k].facN++; facTodas.push(fv); }
  });
  state.hallazgos.forEach((h) => { const k = val(h, F.hal.tarea); if (k && mapa[k] && val(h, F.hal.severidad) === "Alta") mapa[k].alta++; });

  const hallazgos = {};
  ROLES.forEach((r) => hallazgos[r] = { Alta: 0, Media: 0, Baja: 0 });
  state.hallazgos.forEach((h) => { const r = val(h, F.hal.rol), sev = val(h, F.hal.severidad); if (hallazgos[r] && hallazgos[r][sev] !== undefined) hallazgos[r][sev]++; });

  // Clasificación por área (peer review) y matriz de priorización severidad × esfuerzo.
  const porArea = {}; AREAS.forEach((x) => porArea[x] = 0); porArea["Sin clasificar"] = 0;
  const matriz = {}; SEVERIDADES.forEach((sv) => { matriz[sv] = { Bajo: 0, Alto: 0, "Sin estimar": 0 }; });
  state.hallazgos.forEach((h) => {
    const ar = val(h, F.hal.area); porArea[AREAS.includes(ar) ? ar : "Sin clasificar"]++;
    const sv = val(h, F.hal.severidad) || "Media"; const ef = val(h, F.hal.esfuerzo);
    if (matriz[sv]) matriz[sv][ESFUERZOS.includes(ef) ? ef : "Sin estimar"]++;
  });

  const g = {};
  state.insights.forEach((n) => {
    const k = (val(n, F.ins.tema) || "Sin tema").trim() || "Sin tema";
    g[k] = g[k] || { roles: { Reviewer: 0, KLD: 0, Consultant: 0 }, sesiones: new Set(), conf: [] };
    const r = val(n, F.ins.rol); if (g[k].roles[r] !== undefined) g[k].roles[r]++;
    g[k].sesiones.add(val(n, F.ins.idSesion)); g[k].conf.push(val(n, F.ins.confianza));
  });
  const conf = (a) => a.includes("Alta") ? "Alta" : a.includes("Media") ? "Media" : "Baja";
  const temas = Object.entries(g).map(([tema, v]) => ({ tema, roles: v.roles, sesiones: v.sesiones.size, confianza: conf(v.conf) }));

  return {
    generado: new Date().toISOString(),
    totales: {
      sesiones: state.sessions.length, porRol,
      tasaP0: p0.length ? Math.round(p0ok / p0.length * 100) : 0, p0ok, p0total: p0.length,
      noCompletadas: noCompl, hallazgosAltos: altas, insights: state.insights.length,
      facilidadMedia: fac.length ? +(fac.reduce((a, b) => a + b, 0) / fac.length).toFixed(1) : null,
      facilidadTareaMedia: facTodas.length ? +(facTodas.reduce((a, b) => a + b, 0) / facTodas.length).toFixed(1) : null,
      supoQueSeguia: supo
    },
    friccion: Object.entries(mapa).map(([tarea, v]) => ({ tarea, total: v.total, no: v.no, ayuda: v.ayuda, alta: v.alta, facilidad: v.facN ? +(v.facSum / v.facN).toFixed(1) : null })),
    hallazgos, porArea, matriz, temas
  };
}

function descargarArchivo(nombre, contenido, tipo) {
  try {
    const blob = new Blob([contenido], { type: tipo });
    const el = document.createElement("a");
    el.href = URL.createObjectURL(blob);
    el.download = nombre;
    document.body.appendChild(el); el.click(); el.remove();
    return true;
  } catch (err) { return false; }
}

function irA(tab) {
  state.tab = tab;
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".view").forEach((v) => v.classList.add("hide"));
  document.getElementById("v-" + tab).classList.remove("hide");
  if (tab === "registrar") renderRegistrar();
  if (tab === "sesiones") renderSesiones();
  if (tab === "sintesis") renderSintesis();
  if (tab === "matriz") renderMatriz();
  if (tab === "guion") renderGuion();
  try { window.scrollTo(0, 0); } catch (e) {}
}

  if (!p) return;
  setPath(draft, p, e.target.value);
  guardarBorrador();
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.obs) {
    const [i, j] = t.dataset.obs.split(".").map(Number);
    draft.tareas[i].observados = draft.tareas[i].observados || [];
    draft.tareas[i].observados[j] = t.checked;
    guardarBorrador();
    t.closest(".chk").classList.toggle("on", t.checked);

  }

  if (!p) return;

});

document.addEventListener("click", async (e) => {
  /* Solo las pestañas de navegación principal llevan data-tab. Las pestañas
     por rol del guion reutilizan el estilo .tab pero se gestionan más abajo. */
  const tab = e.target.closest(".tab[data-tab]");
  if (tab) { irA(tab.dataset.tab); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;

  if (a === "toggle-paso") { ui.pasoAbierto = ui.pasoAbierto === b.dataset.paso ? null : b.dataset.paso; renderPasos(); }
  else if (a === "siguiente") {
    const ps = pasos();
    const i = ps.findIndex((p) => p.id === b.dataset.paso);
    const act = timers[b.dataset.paso]; if (act && act.desde) { act.ms += Date.now() - act.desde; act.desde = null; }
    ui.pasoAbierto = ps[Math.min(i + 1, ps.length - 1)].id;
    renderPasos();
    const el = document.querySelector(".paso.open"); if (el) try { el.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (err) {}
  }
  else if (a === "crono") { const t = crono(b.dataset.id); if (t.desde) { t.ms += Date.now() - t.desde; t.desde = null; } else t.desde = Date.now(); renderPasos(); }
  else if (a === "crono-reset") { timers[b.dataset.id] = { ms: 0, desde: null }; renderPasos(); }
  else if (a === "mas-detalle") { ui.masDetalle[b.dataset.k] = !ui.masDetalle[b.dataset.k]; renderPasos(); }
  else if (a === "set-res") { draft.tareas[Number(b.dataset.i)].resultado = b.dataset.v; guardarBorrador(); renderPasos(); }
  else if (a === "set-fac-tarea") { const t = draft.tareas[Number(b.dataset.i)]; t.facilidad = String(t.facilidad) === b.dataset.v ? "" : b.dataset.v; guardarBorrador(); renderPasos(); }
  else if (a === "set-cons") { draft.ficha.consentimiento = b.dataset.v; guardarBorrador(); renderPasos(); }
  else if (a === "set-esf") { const h = draft.hallazgos[Number(b.dataset.i)]; h.esfuerzo = h.esfuerzo === b.dataset.v ? "" : b.dataset.v; guardarBorrador(); renderPasos(); }
  else if (a === "set-supo") { draft.cierre.supo = draft.cierre.supo === b.dataset.v ? "" : b.dataset.v; guardarBorrador(); renderPasos(); }
  else if (a === "set-num") { draft.metricas[b.dataset.k] = b.dataset.v; guardarBorrador(); renderPasos(); }
  else if (a === "set-sev") { draft.hallazgos[Number(b.dataset.i)].severidad = b.dataset.v; guardarBorrador(); renderPasos(); }
  else if (a === "set-conf") { draft.insights[Number(b.dataset.i)].confianza = b.dataset.v; guardarBorrador(); renderPasos(); }
  else if (a === "guion-rol") { ui.guionRol = b.dataset.v; renderGuion(); try { window.scrollTo(0, 0); } catch (err) {} }
  else if (a === "add-tarea") {
    draft.tareas.push(nuevaFilaExtra());
    guardarBorrador();
    ui.pasoAbierto = "t" + (draft.tareas.length - 1);
    renderRegistrar();
    const el = document.querySelector(".paso.open"); if (el) try { el.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (err) {}
  }
  else if (a === "del-tarea") {
    draft.tareas.splice(Number(b.dataset.i), 1);
    guardarBorrador();
    ui.pasoAbierto = null;
    renderRegistrar();
  }
  else if (a === "add-hallazgo") { draft.hallazgos.push(nuevoHallazgo(draft.hallazgos.length + 1)); guardarBorrador(); renderPasos(); }
  else if (a === "del-hallazgo") { draft.hallazgos.splice(Number(b.dataset.i), 1); guardarBorrador(); renderPasos(); }
  else if (a === "add-insight") { draft.insights.push(nuevoInsight(draft.insights.length + 1)); guardarBorrador(); renderPasos(); }
  else if (a === "del-insight") { draft.insights.splice(Number(b.dataset.i), 1); guardarBorrador(); renderPasos(); }
  else if (a === "guardar") { await guardarSesion(); }
  else if (a === "limpiar" || a === "cancelar-edicion") {
    draft = nuevoDraft(); sincronizarTareas(); guardarBorrador();
    Object.keys(timers).forEach((k) => delete timers[k]);
    ui.pasoAbierto = "apertura"; renderRegistrar();
  }
  else if (a === "toggle-sesion") { ui.sesionAbierta = ui.sesionAbierta === b.dataset.rec ? null : b.dataset.rec; renderSesiones(); }
  else if (a === "editar-sesion") { cargarEnFormulario(b.dataset.rec); irA("registrar"); }
  else if (a === "borrar-sesion") { confirmarBorrado(b.dataset.rec); }
  else if (a === "confirmar-borrado") { await borrarSesion(b.dataset.rec); }
  else if (a === "cerrar-modal") {
    // Cierra al pulsar un botón Cancelar/Cerrar (el propio target lleva el data-act)
    // o al pulsar el fondo (el overlay es el target directo), pero no al hacer
    // clic dentro del contenido del modal.
    if (e.target === b) document.getElementById("modal-host").innerHTML = "";
  }
  else if (a === "chuleta") { ui.chuleta = !ui.chuleta; renderChuleta(); }
  else if (a === "reintentar") {
    document.getElementById("conn").innerHTML = `<span class="spin"></span><span class="grow">Reintentando…</span>`;
    document.getElementById("conn").className = "note";
    try { await cargarDatos(); toast("Conectado"); } catch (err) { bannerError(err); }
  }
  else if (a === "config-token") { pantallaToken(); }
  else if (a === "borrar-token") { borrarToken(); document.getElementById("modal-host").innerHTML = ""; bannerError({ sinToken: true }); }
  else if (a === "guardar-token") {
    const v = document.getElementById("token-input").value.trim();
    if (!v) { toast("Pega un token antes de guardar", true); return; }
    setToken(v);
    document.getElementById("modal-host").innerHTML = "";
    document.getElementById("conn").innerHTML = `<span class="spin"></span><span class="grow">Conectando…</span>`;
    document.getElementById("conn").className = "note";
    try { await cargarDatos(); toast("Conectado a Airtable"); } catch (err) { bannerError(err); }
  }
  else if (a === "descargar-csv") {
    const host = document.getElementById("modal-host");
    try {
      const blob = new Blob(["﻿" + host._csv], { type: "text/csv;charset=utf-8;" });
      const el = document.createElement("a");
      el.href = URL.createObjectURL(blob);
      el.download = (host._nombre || "export").toLowerCase().replace(/\s+/g, "-") + ".csv";
      document.body.appendChild(el); el.click(); el.remove();
    } catch (err) { toast("La descarga está bloqueada; copia el texto", true); }
  }
  else if (a === "export-hallazgos") {
    mostrarCSV("Hallazgos EI Tracker", aCSV(["sesion", "rol", "tarea", "severidad", "area", "esfuerzo", "hallazgo", "evidencia", "impacto", "recomendacion"],
      state.hallazgos.map((h) => [val(h, F.hal.idSesion), val(h, F.hal.rol), val(h, F.hal.tarea), val(h, F.hal.severidad), val(h, F.hal.area), val(h, F.hal.esfuerzo), val(h, F.hal.hallazgo), val(h, F.hal.evidencia), val(h, F.hal.impacto), val(h, F.hal.recomendacion)])));
  }
  else if (a === "export-snapshot") {
    if (!state.conectado) { toast("Conéctate con tu token antes de generar el snapshot", true); return; }
    if (!state.sessions.length) { toast("Aún no hay sesiones que publicar", true); return; }
    const ok = descargarArchivo("datos.json", JSON.stringify(construirSnapshot(), null, 2), "application/json");
    toast(ok ? "datos.json descargado · súbelo al repositorio para publicarlo" : "La descarga está bloqueada por el navegador", !ok);
  }
});

function cargarEnFormulario(recId) {
  const s = state.sessions.find((x) => x.id === recId);
  if (!s) return;
  const id = val(s, F.ses.id);
  const tar = hijosDe(id, state.tareas, F.tar.idSesion);
  const hal = hijosDe(id, state.hallazgos, F.hal.idSesion);
  const ins = hijosDe(id, state.insights, F.ins.idSesion);
  draft = nuevoDraft();
  draft.recId = recId; draft.idSesion = id;
  draft.childIds = { tar: tar.map((r) => r.id), hal: hal.map((r) => r.id), ins: ins.map((r) => r.id) };
  draft.ficha = {
    fecha: val(s, F.ses.fecha) || "", hora: val(s, F.ses.hora), rol: val(s, F.ses.rol) || "Reviewer",
    participante: val(s, F.ses.participante),
    consentimiento: val(s, F.ses.consentimiento) || "Sí", grabacion: val(s, F.ses.grabacion),
    incidencias: val(s, F.ses.incidencias)
  };
  draft.respInicial = val(s, F.ses.respInicial);
  sincronizarTareas();
  const refs = bloquesDeSesion(draft.ficha.rol);
  if (tar.length) {
    draft.tareas = tar.map((t) => {
      const nombre = val(t, F.tar.tarea);
      const ref = refs.find((r) => r.nombre === nombre);
      const bloque = val(t, F.tar.bloque) || "Tarea adicional";
      return {
        extra: !ref, consigna: "",
        bloque, tarea: nombre, prioridad: val(t, F.tar.prioridad) || "P1",
        resultado: val(t, F.tar.resultado), tiempo: val(t, F.tar.tiempo), ruta: val(t, F.tar.ruta),
        primerClic: val(t, F.tar.primerClic), errores: val(t, F.tar.errores), bloqueo: val(t, F.tar.bloqueo),
        ayuda: val(t, F.tar.ayuda), expectativa: val(t, F.tar.expectativa), interpreto: val(t, F.tar.interpreto),
        cita: val(t, F.tar.cita), observacion: val(t, F.tar.observacion), facilidad: val(t, F.tar.facilidad), observados: [], sondeoResp: [], _ref: ref
      };
    });
  }
  draft.metricas = { errores: val(s, F.ses.mErrores), retrocesos: val(s, F.ses.mRetrocesos), facilidad: val(s, F.ses.mFacilidad), confianza: val(s, F.ses.mConfianza) };
  draft.cierre = { confuso: val(s, F.ses.cConfuso), siguiente: val(s, F.ses.cSiguiente), supo: val(s, F.ses.cSupo), faltante: val(s, F.ses.cFaltante), cambio: val(s, F.ses.cCambio) };
  draft.sintesis = { objetivo: val(s, F.ses.sObjetivo), resultado: val(s, F.ses.sResultado), necesidad: val(s, F.ses.sNecesidad), dificultad: val(s, F.ses.sDificultad), claro: val(s, F.ses.sClaro), riesgo: val(s, F.ses.sRiesgo) };
  draft.preguntas = val(s, F.ses.preguntas);
  draft.hallazgos = hal.map((h, i) => ({
    codigo: (String(val(h, F.hal.id)).split("·").pop() || "").trim() || "H-" + String(i + 1).padStart(2, "0"),
    tarea: val(h, F.hal.tarea), hallazgo: val(h, F.hal.hallazgo), evidencia: val(h, F.hal.evidencia),
    impacto: val(h, F.hal.impacto), severidad: val(h, F.hal.severidad) || "Media", recomendacion: val(h, F.hal.recomendacion),
    area: val(h, F.hal.area), esfuerzo: val(h, F.hal.esfuerzo)
  }));
  draft.insights = ins.map((n, i) => ({
    codigo: (String(val(n, F.ins.id)).split("·").pop() || "").trim() || "I-" + String(i + 1).padStart(2, "0"),
    necesidad: val(n, F.ins.necesidad), motivacion: val(n, F.ins.motivacion), barrera: val(n, F.ins.barrera),
    consecuencia: val(n, F.ins.consecuencia), confianza: val(n, F.ins.confianza) || "Media", tema: val(n, F.ins.tema)
  }));
  ui.pasoAbierto = "despues";
  guardarBorrador();
}

function confirmarBorrado(recId) {
  const s = state.sessions.find((x) => x.id === recId);
  document.getElementById("modal-host").innerHTML = `<div class="overlay" data-act="cerrar-modal">
    <div class="modal">
      <p>¿Eliminar la sesión <b>${esc(val(s, F.ses.id))}</b> con sus tareas, hallazgos e insights? También se borra en Airtable.</p>
      <div class="row-actions"><button class="btn sm" data-act="cerrar-modal">Cancelar</button>
        <button class="btn sm primary" style="background:var(--alta-dot);border-color:var(--alta-dot)" data-act="confirmar-borrado" data-rec="${recId}">Eliminar</button>
      </div></div></div>`;
}

async function borrarSesion(recId) {
  const s = state.sessions.find((x) => x.id === recId);
  const id = val(s, F.ses.id);
  document.getElementById("modal-host").innerHTML = "";
  try {
    const gr = [
      [T.tar, hijosDe(id, state.tareas, F.tar.idSesion).map((r) => r.id)],
      [T.hal, hijosDe(id, state.hallazgos, F.hal.idSesion).map((r) => r.id)],
      [T.ins, hijosDe(id, state.insights, F.ins.idSesion).map((r) => r.id)]
    ];
    for (const [tid, arr] of gr) if (arr.length) await deleteRecords(tid, arr);
    await deleteRecords(T.ses, [recId]);
    ui.sesionAbierta = null;
    await cargarDatos(); renderSesiones(); toast("Sesión eliminada");
  } catch (e) { toast("No se pudo eliminar: " + e.message, true); }
}

/* ===================== Arranque ===================== */
(async function init() {
  cargarBorrador();
  renderRegistrar();
  if (!getToken()) {
    bannerError({ sinToken: true });
    pantallaToken("Pega tu token personal de Airtable para leer y guardar las sesiones de todo el equipo. Solo hace falta hacerlo una vez por navegador.");
  } else {
    try { await cargarDatos(); } catch (e) { bannerError(e); }
  }
  renderRegistrar();
})();

</script>
